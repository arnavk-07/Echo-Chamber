<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Echo Chamber - Automated Demo Recorder</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #fff;
    }
    canvas { display: block; cursor: crosshair; }

    #overlay-banner {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 20, 30, 0.92);
      border: 2px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 15px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s;
    }
    .pulse-dot {
      width: 12px;
      height: 12px;
      background: #ff3344;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff3344;
      animation: blink 0.8s infinite alternate;
    }
    @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }

    #start-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 5, 10, 0.88);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .start-btn {
      background: linear-gradient(135deg, #00d2ff 0%, #0077ff 100%);
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      padding: 18px 40px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 150, 255, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 45px rgba(0, 200, 255, 0.9);
    }
  </style>
</head>
<body>

  <div id="start-modal">
    <h1 style="font-size: 38px; color: #7cf; margin-bottom: 8px; letter-spacing: 2px;">ECHO CHAMBER</h1>
    <p style="color: #aaa; max-width: 500px; line-height: 1.5; margin-bottom: 28px;">
      Automated Demo Video Recorder.<br>
      Click below to record a 20-second cinematic gameplay sequence directly to your Downloads folder!
    </p>
    <button class="start-btn" id="start-record-btn">🎬 START DEMO RECORDING</button>
  </div>

  <div id="overlay-banner" style="display: none;">
    <div class="pulse-dot"></div>
    <span id="record-status">🎥 Recording Demo Gameplay (20s)...</span>
  </div>

  <canvas id="game"></canvas>

  <script src="js/map.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>

  <script>
    (() => {
      const modal = document.getElementById('start-modal');
      const startBtn = document.getElementById('start-record-btn');
      const banner = document.getElementById('overlay-banner');
      const statusText = document.getElementById('record-status');
      const canvas = document.getElementById('game');

      startBtn.addEventListener('click', () => {
        modal.style.display = 'none';
        banner.style.display = 'flex';
        beginDemoRecording();
      });

      function sendKey(code, down) {
        window.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code: code, bubbles: true }));
      }

      function tapKey(code, dur = 100) {
        sendKey(code, true);
        setTimeout(() => sendKey(code, false), dur);
      }

      function beginDemoRecording() {
        // 1. Initialize audio & start game
        if (typeof Sfx !== 'undefined' && Sfx.init) {
          Sfx.init();
        }
        tapKey('Space', 100);

        // 2. Setup Canvas + MediaRecorder
        const stream = canvas.captureStream(60);
        let options = { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 6000000 };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
          options = { mimeType: 'video/webm' };
        }

        const recorder = new MediaRecorder(stream, options);
        const chunks = [];

        recorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'echo-chamber-gameplay-demo.webm';
          document.body.appendChild(a);
          a.click();

          statusText.innerHTML = "✅ Demo saved to Downloads folder as <b>echo-chamber-gameplay-demo.webm</b>!";
          banner.style.borderColor = "#00ff88";
          banner.style.boxShadow = "0 0 25px rgba(0, 255, 136, 0.6)";
        };

        recorder.start();

        // 3. Automated Playthrough Sequence (20 seconds)
        let elapsed = 0;
        const totalDuration = 20;

        const timer = setInterval(() => {
          elapsed++;
          const remaining = totalDuration - elapsed;
          if (remaining > 0) {
            statusText.textContent = `🎥 Recording Demo: ${remaining}s left... (Walking & Sonar)`;
          } else {
            clearInterval(timer);
          }
        }, 1000);

        // Sequence of actions:
        // t = 0.5s: First sonar pulse to reveal starting room
        setTimeout(() => { tapKey('Space', 80); }, 500);

        // t = 1.8s: Start walking East (D)
        setTimeout(() => { sendKey('KeyD', true); }, 1800);

        // t = 3.5s: Tap sonar while walking
        setTimeout(() => { tapKey('Space', 80); }, 3500);

        // t = 4.5s: Stop D, walk South (S)
        setTimeout(() => { sendKey('KeyD', false); sendKey('KeyS', true); }, 4500);

        // t = 6.0s: Big charged pulse (hold Space)
        setTimeout(() => {
          sendKey('Space', true);
          statusText.textContent = `🎥 Recording: Charging Mega Sonar Wave...`;
        }, 6000);
        setTimeout(() => {
          sendKey('Space', false); // release mega pulse
        }, 7300);

        // t = 8.0s: Stop S, walk East (D) and sprint (Shift)
        setTimeout(() => {
          sendKey('KeyS', false);
          sendKey('KeyD', true);
          sendKey('ShiftLeft', true);
        }, 8000);

        // t = 10.0s: Release sprint, fire another pulse
        setTimeout(() => {
          sendKey('ShiftLeft', false);
          tapKey('Space', 80);
        }, 10000);

        // t = 12.0s: Walk North-East (W + D)
        setTimeout(() => {
          sendKey('KeyW', true);
        }, 12000);

        // t = 14.0s: Tap sonar
        setTimeout(() => {
          tapKey('Space', 80);
        }, 14000);

        // t = 16.0s: Throw distraction flare/item (mouse click)
        setTimeout(() => {
          sendKey('KeyW', false);
          sendKey('KeyD', false);
          window.dispatchEvent(new MouseEvent('mousedown', { clientX: window.innerWidth * 0.7, clientY: window.innerHeight * 0.4 }));
        }, 16000);

        // t = 17.5s: Final wide pulse to illuminate corridor
        setTimeout(() => {
          tapKey('Space', 80);
        }, 17500);

        // t = 20.0s: Finish and export
        setTimeout(() => {
          sendKey('KeyW', false);
          sendKey('KeyA', false);
          sendKey('KeyS', false);
          sendKey('KeyD', false);
          recorder.stop();
        }, totalDuration * 1000);
      }
    })();
  </script>
</body>
</html>
